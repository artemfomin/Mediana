    <path d="M 216 248 L 304 160 L 320 152 L 336 160 L 424 236" stroke="url(#gray)"/>
    <path d="M 88 276 L 176 352 L 192 360 L 208 352 L 296 264" stroke="url(#gray)"/>
    <path d="M 216 264 L 304 352 L 320 360 L 336 352 L 424 276" stroke="url(#lime)"/>
  </g>
